name: Update profile README

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: profile-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Comprobar tipos y regresiones
        run: |
          npm run check
          npm test
      - name: Actualizar el perfil
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          INCLUDE_PRIVATE_REPOS: 'true'
          MAX_LANGUAGE_REPOS: '500'
          SEARCH_PAGES: '3'
          EXCLUDED_LANGUAGES: Hack
        run: npm run build
      - name: Publicar los cambios
        if: github.ref == 'refs/heads/main'
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo 'El perfil ya está actualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(profile): refresh activity $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push origin HEAD:main
