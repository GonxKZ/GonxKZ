name: Generate snake

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: profile-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generar la animación del calendario
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN || github.token }}
          outputs: dist/snake.svg
      - name: Publicar la animación
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo 'El calendario ya está actualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(profile): refresh calendar $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push origin HEAD:main
